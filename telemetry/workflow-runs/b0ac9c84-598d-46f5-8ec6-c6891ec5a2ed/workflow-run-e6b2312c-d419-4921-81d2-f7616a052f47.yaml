                      done: true
                    - id: '6.5'
                      description: >-
                        Remove @wip from 'Existing behavior is unchanged when
                        Scottish mode is off' once its steps pass.
                      done: true
                    - id: '6.6'
                      description: >-
                        Remove @wip from 'Non-flagged posts are never rewritten'
                        once its steps pass.
                      done: true
                    - id: '6.7'
                      description: >-
