                    - Add/extend extensions/models/spec_change_test.ts coverage
                    for both: a
                      scenario already marked pass is not re-tagged @wip on regeneration;
                      record-results succeeds from verifying phase.

                    Out of scope: the separate, already-known reopen-proposal
                    gap (revisiting

                    an approved proposal) — related pattern, different fix,
                    tracked

                    separately.


                    ## Success criteria


                    - A scenario that has recorded a real pass/fail result is
                    never re-tagged
                      @wip by a later generate-features call.
                    - record-results can be called again from verifying phase
                    without a
                      state-file hand-edit.
                    - New/updated Deno tests in spec_change_test.ts cover both
                    behaviors and
                      pass.
                  design_text: >
                    ## Approach


                    Two independent, surgical fixes in
                    extensions/models/spec_change.ts:


                    1. buildFeatureFile(changeName, scenarios) currently pushes
                    "@wip"
                       unconditionally for every scenario (line ~113). Change the condition to
                       only push "@wip" when scenario.status === "pending". Scenarios default
                       to status "pending" on creation (see set-scenarios), so brand-new
                       scenarios are unaffected — this only changes behavior once a scenario
                       has a real recorded outcome.
                    2. The "record-results" method execute()'s call to
                    updateState currently
                       passes ["implementing"] as the allowed-phases list (line ~358). Change
                       it to ["implementing", "verifying"] so a second (or Nth) verify pass
                       doesn't require a manual phase reset.

                    Neither fix touches the archive method's own guard (still
                    requires

                    "verifying" phase and all scenarios status "pass") —
                    archiving semantics

                    are unchanged.


                    ## Files to change


                    - extensions/models/spec_change.ts — the two fixes above.

                    - extensions/models/spec_change_test.ts — direct Deno unit
                    tests are the
                      primary verification (fast, precise, matches this file's existing
                      testing convention): a scenario with status "pass" (and separately
                      "fail") is not @wip-tagged by buildFeatureFile; record-results
                      succeeds when called with state.phase already "verifying".
                    - tests/cucumber/step-definitions/spec-gate-verify-loop.js
                    (new) — Given/
                      When/Then steps for the three approved scenarios, exercising the fix
                      through the real `swamp` CLI (see step definition strategy below).

                    ## Key decisions


                    - Deno-vs-Node boundary: spec_change.ts is a Deno extension
                    module (uses
                      Deno.readTextFile/writeTextFile) with no existing TS loader configured
                      for this project's Node-based Cucumber runner (cucumber.mjs has no
                      --loader or ts-node setup, and no existing step definition imports a
                      .ts file). Rather than add new cross-runtime tooling, the Cucumber
                      scenarios exercise the fix through the actual `swamp` CLI via
                      child_process (execFileSync), the same public interface a human or
                      agent uses. This is the same boundary-testing approach already used for
                      the mutation-coverage-95 scenario (which read stryker.config.json
                      directly rather than importing Stryker internals).
                    - The Deno unit tests in spec_change_test.ts are the fast,
                    precise
                      verification of the actual logic change; the Cucumber scenarios are a
                      slower, end-to-end confidence check through the real CLI. Both are
                      written — the spec-coverage tooling accepts either as satisfying a
                      scenario, and here both apply.
                    - Cucumber steps use a disposable spec-change name
                      (spec-gate-verify-loop-fixture) created fresh in a Before hook and
                      deleted (its .swamp/spec-change-*.json state file removed) in an After
                      hook, so the test suite doesn't leave stray state files in the real
                      project's .swamp/ directory.

                    ## Step definition strategy


                    Scenario 1 ("A passed scenario is not re-tagged @wip..."):

                    - Given: create the fixture change, set-proposal,
                    approve-proposal,
                      set-scenarios (one scenario), approve-scenarios, start-implementing,
                      then directly write a passing cucumber-report.json fixture and call
                      record-results so the scenario's status becomes "pass".
                    - When: call generate-features again.

                    - Then: read the written .feature file from
                    tests/cucumber/features/ and
                      assert the scenario's block does not contain "@wip".

                    Scenario 2 ("A failed scenario is not re-tagged @wip
                    either"):

                    - Same as above but the fixture cucumber-report.json marks
                    the scenario
                      failed, so status becomes "fail" before the When step.

                    Scenario 3 ("record-results can be re-run after
                    verifying..."):

                    - Given: run the fixture through record-results once (phase
                    becomes
                      "verifying").
                    - When: call record-results again with a second (fresh)
                    report file.

                    - Then: assert the CLI call exits 0 (does not throw the
                    phase-guard
                      error) and the state file's scenario statuses reflect the second
                      report.

                    All three scenarios share a Before/After hook pair (create +
                    cleanup) in

                    the new step-definition file, following this project's
                    existing

                    screenplay/support pattern of colocated setup helpers.


                    ## Risks / trade-offs


                    - Shelling out to the swamp CLI from Cucumber steps is
                    slower than an
                      in-process call and depends on `swamp` being on PATH in CI — already
                      true for every other swamp-based check in this project's quality gates,
                      so no new dependency is introduced.
                    - The fixture change's name must not collide with a real
                    in-progress
                      spec-change; using a distinctive, clearly-disposable name and cleaning
                      up in an After hook (that runs even on failure) avoids state leaking
                      into future runs.
                    - This does not fix the separate, already-known
                    reopen-proposal gap
                      (revisiting an approved proposal) — explicitly out of scope per the
                      proposal.
                  scenarios:
                    - name: >-
                        A passed scenario is not re-tagged @wip on a later
                        feature-file regeneration
                      feature: spec-gate-verify-loop-fix
                      given:
                        - >-
                          a spec-change scenario has already recorded a passing
                          result
                      when:
                        - generate-features runs again for that change
                      then:
                        - >-
                          the scenario's entry in the generated feature file has
                          no @wip tag
                      status: pending
                    - name: A failed scenario is not re-tagged @wip either
                      feature: spec-gate-verify-loop-fix
                      given:
                        - >-
                          a spec-change scenario has already recorded a failing
                          result
                      when:
                        - generate-features runs again for that change
                      then:
                        - >-
                          the scenario's entry in the generated feature file has
                          no @wip tag
                      status: pending
                    - name: >-
                        record-results can be re-run after the verifying phase
                        has already been entered
                      feature: spec-gate-verify-loop-fix
                      given:
                        - >-
                          a spec-change has already moved to the verifying phase
                          from a prior record-results call
                      when:
                        - >-
                          record-results is called again with a fresh cucumber
                          report
                      then:
                        - >-
                          it succeeds and updates scenario statuses without
                          requiring a manual phase reset
                      status: pending
                  tasks:
                    - id: '1.1'
                      description: >-
                        In extensions/models/spec_change.ts's buildFeatureFile,
                        only push '@wip' for a scenario when scenario.status ===
                        'pending' (leave pass/fail scenarios untagged).
                      done: true
                    - id: '1.2'
                      description: >-
                        In extensions/models/spec_change.ts's record-results
                        method, widen its updateState phases argument from
                        ['implementing'] to ['implementing', 'verifying'].
                      done: true
                    - id: '2.1'
                      description: >-
                        Add a Deno test in
                        extensions/models/spec_change_test.ts: buildFeatureFile
                        does not add @wip for a scenario with status 'pass'.
                      done: true
                    - id: '2.2'
                      description: >-
                        Add a Deno test in
                        extensions/models/spec_change_test.ts: buildFeatureFile
                        does not add @wip for a scenario with status 'fail'.
                      done: true
                    - id: '2.3'
                      description: >-
                        Add a Deno test in
                        extensions/models/spec_change_test.ts: record-results
                        succeeds (does not throw) when called a second time with
                        state.phase already 'verifying', and updates scenario
                        statuses from the new report.
                      done: true
                    - id: '2.4'
                      description: >-
                        Run the Deno extension test suite and confirm all
                        spec_change_test.ts tests pass, including the three new
                        ones.
                      done: true
                    - id: '3.1'
                      description: >-
                        Create
                        tests/cucumber/step-definitions/spec-gate-verify-loop.js
                        with Before/After hooks that create a disposable fixture
                        spec-change (e.g. 'spec-gate-verify-loop-fixture') via
                        swamp CLI child_process calls in Before, and delete its
                        .swamp/spec-change-*.json state file in After.
                      done: true
                    - id: '3.2'
                      description: >-
                        Implement Given/When/Then steps for 'A passed scenario
                        is not re-tagged @wip on a later feature-file
                        regeneration': drive the fixture through
                        create/set-proposal/approve-proposal/set-scenarios/approve-scenarios/start-implementing/record-results
                        (with a passing report) to reach status 'pass', call
                        generate-features again, then assert the written
                        .feature file has no @wip for that scenario.
                      done: true
                    - id: '3.3'
                      description: >-
                        Implement Given/When/Then steps for 'A failed scenario
                        is not re-tagged @wip either': same flow as 3.2 but with
                        a failing cucumber-report.json fixture so status becomes
                        'fail', then assert the regenerated .feature file still
                        has no @wip.
                      done: true
                    - id: '3.4'
                      description: >-
                        Implement Given/When/Then steps for 'record-results can
                        be re-run after the verifying phase has already been
                        entered': call record-results once (phase becomes
                        'verifying'), then call it again with a second report
                        and assert the CLI call exits 0 and the state file's
                        scenario statuses reflect the second report.
                      done: true
                    - id: '4.1'
                      description: >-
                        Run swamp model method run spec-change generate-features
                        --name spec-gate-verify-loop-fix to emit the @wip-tagged
                        Gherkin feature file, then confirm the step text in
                        3.2-3.4 matches it exactly.
                      done: true
                    - id: '4.2'
                      description: >-
                        Remove @wip from all three scenarios in
                        tests/cucumber/features/spec-gate-verify-loop-fix.feature
                        now that their steps are implemented and passing.
                      done: true
                    - id: '4.3'
                      description: >-
                        Run the full Cucumber suite (npm run bdd) and confirm
                        all three new scenarios pass along with the rest of the
                        existing suite.
                      done: true
                    - id: '4.4'
                      description: >-
                        Run the full vitest suite and quality-gate-fast workflow
                        to confirm no regressions from the extension model
                        change.
                      done: true
