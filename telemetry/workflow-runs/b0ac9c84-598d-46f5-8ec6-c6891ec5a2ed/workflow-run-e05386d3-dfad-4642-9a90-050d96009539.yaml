          resources:
            change:
              code-health-smell-insights:
                id: 3a033a86-3b5b-48e7-abb8-210046deca6a
                name: code-health-smell-insights
                version: 29
                isLatest: true
                createdAt: '2026-07-03T13:45:03.924Z'
                namespace: ''
                attributes:
                  name: code-health-smell-insights
                  phase: verifying
                  proposal_text: >-
                    ## Why

                    The Quality Gates section of CLAUDE.md tells the agent to
                    check Code Health via the CodeScene MCP tools before
                    committing. Nothing surfaces how often that instruction was
                    skipped and the agent got caught by the hard gate instead —
                    even though the data already exists. Every failed
                    `codescene-health` step's error message already contains,
                    per degraded file, the file path and score (e.g.
                    "(9.38/10)"), and this has already happened 14 times across
                    the 192 codescene-health runs recorded in
                    telemetry/workflow-runs/. None of it is parsed or shown
                    anywhere: `parseCodeSceneStep`'s failure-path fallback in
                    scripts/generate-guardrails-dashboard.js only extracts a
                    file count and bare paths, discarding the score; the
                    dashboard only ever prints "N degraded" or a bare filename.


                    ## What

                    - Extend `parseCodeSceneStep`'s regex fallback in
                    scripts/generate-guardrails-dashboard.js to also capture the
                    score from the existing "(score/10)" pattern in error text,
                    and compute gap-to-10 = 10 - score.

                    - Add a "Code Health Guardrail Catches" summary card to the
                    dashboard, computed entirely from existing telemetry: total
                    catches (broken out pre-commit quality-gate-fast vs pre-push
                    quality-gate), which files were caught and how many times
                    each, and the average/worst gap-to-10 among catches.

                    - No changes to extensions/models/focusin_codescene.ts — the
                    extension's error message already contains everything
                    needed; this is read-only summarization of data already
                    captured, not a new data-capture change.

                    - Out of scope: code smell / finding category detail. That
                    detail is genuinely not present in any committed telemetry
                    today — it only exists in the ephemeral, gitignored
                    .swamp/data/ resource, so surfacing it would require
                    extending the extension's captured output, which is
                    explicitly deferred.


                    ## Success criteria

                    - Running the dashboard generator against the current
                    telemetry/workflow-runs/ produces a summary card showing the
                    real historical count (14 catches out of 192
                    codescene-health runs today) with a per-file breakdown and
                    gap-to-10 stats — no new runs required, no extension
                    changes.

                    - tests/unit/guardrails-dashboard.test.js covers the new
                    score parsing and the new card's rendering.
                  design_text: >-
                    ## Approach

                    Extend the existing pure-function pipeline in
                    scripts/generate-guardrails-dashboard.js — the same module
                    quality-trend-report.js already extended — rather than
                    introducing any new model, report, or data source.
                    Everything needed is already inside the `error` string on a
                    failed `codescene-health` step, in the exact format written
                    by extensions/models/focusin_codescene.ts:
                      `  ${projectDir}/${f.name}  (${f.newScore}/10)`

                    1. Extend `parseCodeSceneStep`'s failure-fallback branch
                    (the `if (step.status === "failed")`-adjacent path that
                    today only regexes out a count and bare paths) to match
                    `/^\s{2,}(\S+\.(?:js|ts))\s+\(([\d.]+)\/10\)/gm` per line,
                    capturing both path and score in one pass. For each matched
                    file compute `gapToTen = Math.round((10 - score) * 100) /
                    100` (rounding avoids float noise, e.g. 10 - 9.38 =
                    0.6200000000000001 -> 0.62). If a line's score doesn't match
                    (malformed text), keep falling back to the existing
                    bare-path regex so the file is still counted with `score:
                    null, gapToTen: null` rather than dropped or erroring.

                    2. Add a new pure function `computeGuardrailCatches(runs)`:
                       - A "catch" = one run whose `metrics.codescene` exists and `.passed === false` (regardless of how many files it lists) — this matches how "14 catches out of 192 codescene-health runs" was counted.
                       - `totalCatches`, and `byWorkflow: { "quality-gate": n, "quality-gate-fast": n }` (pre-push vs pre-commit).
                       - `byFile`: a map/array of `{ path, count }` — incremented once per catching run the file appears in (so the same file caught across 3 different runs shows count 3).
                       - `avgGap` / `worstGap`: mean and max of every non-null `gapToTen` across all files in all catching runs; both `null` if no scores were parseable (e.g. zero catches).
                    3. Add `renderGuardrailCatchesCard(catches)` producing the
                    "Code Health Guardrail Catches" HTML card: totals split
                    pre-commit/pre-push, a per-file table, and avg/worst
                    gap-to-10. When `totalCatches === 0` it still renders the
                    card shell with zero counts (mirrors `renderTrendCard`'s
                    "insufficient history" empty state) rather than omitting the
                    section.

                    4. Wire `guardrailCatches: computeGuardrailCatches(runs)`
                    into `buildData`, and insert
                    `renderGuardrailCatchesCard(data.guardrailCatches)` into
                    `renderHtml` (after the existing Quality Trends card).

                    5. Export `computeGuardrailCatches` and
                    `renderGuardrailCatchesCard` alongside the module's other
                    exports for direct testing, same as
                    `computeTrends`/`renderTrendCard`.


                    ## Files to change

                    - scripts/generate-guardrails-dashboard.js — regex/score/gap
                    parsing, `computeGuardrailCatches`,
                    `renderGuardrailCatchesCard`, wiring into
                    `buildData`/`renderHtml`/exports.

                    - tests/unit/guardrails-dashboard.test.js — vitest coverage
                    for the new parsing branch and the two new functions
                    (mirrors existing `computeTrends`/`renderTrendCard` test
                    blocks).

                    - tests/cucumber/features/code-health-smell-insights.feature
                    — the 7 approved scenarios verbatim.

                    -
                    tests/cucumber/step-definitions/code-health-smell-insights.js
                    — step definitions, following the established pattern in
                    step-definitions/quality-trend-report.js.


                    ## Key decisions

                    - No changes to extensions/models/focusin_codescene.ts or
                    any swamp model/report — this is read-only summarization of
                    what committed telemetry already contains, per the approved
                    proposal's explicit scope cut.

                    - "Catch" is counted at the run level (one failed
                    codescene-health step = one catch), not at the file-listing
                    level, so totals stay consistent with the existing 14/192
                    figure found in current telemetry.

                    - Per-file breakdown counts are independent of the run-level
                    total: a single run listing 2 degraded files contributes 1
                    to each file's count, but only 1 to `totalCatches`.

                    - Malformed/unparseable score text degrades gracefully to
                    `score: null, gapToTen: null` for that file — it must not
                    throw, and the file must still be counted (per the
                    "malformed error message" scenario).


                    ## Step definition strategy

                    - For the raw-text parsing scenarios (score extraction,
                    multi-file gap computation, malformed error), call
                    `parseCodeSceneStep` directly with a hand-built fake `step`
                    object of shape `{ status: "failed", error: "<multi-line
                    synthetic error text>" }` (no `output.resources`), which
                    forces the fallback branch — exactly how `extractStepAttrs`
                    already treats a failed step with no embedded attributes.

                    - For the aggregation/rendering scenarios (total/by-workflow
                    counts, per-file breakdown, avg/worst gap, zero-catch
                    state), build fake `run`-shaped objects (the `parseRun()`
                    output shape: `{ workflowName, metrics: { codescene: {
                    passed, files } } }`) and call
                    `computeGuardrailCatches(runs)` directly, then
                    `renderGuardrailCatchesCard(result)` and assert on the
                    returned HTML string — the same two-step pattern
                    `quality-trend-report.js` uses for
                    `computeTrends`/`renderTrendCard`.


                    ## Risk / trade-offs

                    - The new regex must still correctly parse the 14 real
                    historical failed-run error strings already committed in
                    telemetry/workflow-runs/ — worth a manual spot-check against
                    at least one real file (e.g.
                    workflow-run-243f7ff0-4c46-4d9d-9b46-65c02819ce6e.yaml)
                    during implementation, not just synthetic fixtures.

                    - The existing attrs-available branch of
                    `parseCodeSceneStep` (`attrs.failedFiles !== undefined`,
                    used when a step has embedded resource output) is left
                    untouched and will not carry `score`/`gapToTen` — acceptable
                    because catches (failed steps) always take the fallback,
                    error-text path today; passing runs have no catch to report
                    on anyway.
                  scenarios:
                    - name: Extracting score from a degraded-file error message
                      feature: code-health-smell-insights
                      given:
