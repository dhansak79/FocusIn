                      when:
                        - the dashboard parses that step
                      then:
                        - >-
                          each file's gap-to-10 is computed independently and
                          every file appears in the parsed result
                      status: pending
                    - name: Counting total guardrail catches across workflows
                      feature: code-health-smell-insights
                      given:
                        - >-
                          telemetry containing codescene-health failures from
                          both quality-gate and quality-gate-fast runs
                      when:
                        - the dashboard summary is built
                      then:
                        - >-
                          the Code Health Guardrail Catches card shows the total
                          catch count broken out by pre-commit and pre-push
                      status: pending
                    - name: Breaking down catches by file
                      feature: code-health-smell-insights
                      given:
                        - >-
                          telemetry where the same file is caught by the
                          codescene-health gate in more than one run
                      when:
                        - the dashboard summary is built
                      then:
                        - >-
                          the card lists that file with a catch count reflecting
                          every run it appeared in
                      status: pending
                    - name: Reporting average and worst gap-to-10
                      feature: code-health-smell-insights
                      given:
                        - >-
                          telemetry containing multiple codescene-health catches
                          with different scores
                      when:
                        - the dashboard summary is built
                      then:
                        - >-
                          the card shows the average gap-to-10 and the single
                          worst largest gap-to-10 across all catches
                      status: pending
                    - name: No guardrail catches recorded
                      feature: code-health-smell-insights
                      given:
                        - telemetry where every codescene-health run passed
                      when:
                        - the dashboard summary is built
                      then:
                        - >-
                          the card reports zero catches instead of an error or
