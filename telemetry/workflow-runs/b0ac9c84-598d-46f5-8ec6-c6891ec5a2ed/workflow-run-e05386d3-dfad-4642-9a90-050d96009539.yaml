                      status: pending
                    - name: Malformed error message without a parseable score
                      feature: code-health-smell-insights
                      given:
                        - >-
                          a codescene-health failure whose error text does not
                          match the (score/10) pattern
                      when:
                        - the dashboard parses that step
                      then:
                        - >-
                          the file is still counted as a catch with a null score
                          rather than crashing the parser
                      status: pending
